name: CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts app.py
      - run: python -m symbolic_discovery run --config configs/smoke.json --output runs/ci-smoke
      # Julia integration is opt-in; routine CI must not require a Julia download.
