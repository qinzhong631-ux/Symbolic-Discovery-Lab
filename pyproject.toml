[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-discovery-lab"
version = "0.1.0"
description = "Reproducible discovery of mathematical laws from synthetic data"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "torch>=2.6,<3", "sympy>=1.13,<2", "matplotlib>=3.9,<4", "gradio>=6,<7"]

[project.optional-dependencies]
symbolic = ["pysr>=1.5,<3"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
symbolic-lab = "symbolic_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["pysr: opt-in test requiring Julia (set RUN_PYSR_TESTS=1)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

